<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do barbeiro</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales/pt-br.global.min.js"></script>
</head>
<body>

  <div class="barra-superior">
    <h1>IRON<span>BLADE</span> · <span id="nome-barbeiro-topo"></span></h1>
    <div class="barra-superior-acoes">
      <button id="botao-faturamento" class="botao-secundario">Faturamento</button>
      <button id="botao-config" class="botao-secundario">Expediente</button>
      <button id="botao-sair" class="botao-secundario">Sair</button>
    </div>
  </div>

  <div id="calendario"></div>

  <!-- Modal: clicou num horário livre -->
  <div id="modal-novo" class="modal-fundo escondido">
    <div class="modal-caixa">
      <button class="botao-fechar" data-fechar="modal-novo" aria-label="Fechar">×</button>
      <h2>Novo</h2>
      <p id="novo-info" class="modal-info"></p>

      <div class="painel-acoes" style="margin-bottom:1rem;">
        <button class="botao-secundario aba-tipo ativa" data-tipo="bloqueado">Bloquear (folga)</button>
        <button class="botao-secundario aba-tipo" data-tipo="reservado">Marcar cliente</button>
      </div>

      <form id="form-novo">
        <div id="campos-cliente" class="escondido">
          <label for="novo-servico">Serviço</label>
          <select id="novo-servico"></select>
          <label for="novo-nome"></label>
          <input type="text" id="novo-nome" placeholder="Nome do Cliente">
          <label for="novo-telefone"></label>
          <input type="tel" id="novo-telefone" placeholder="Telefone">
          <label for="novo-email"></label>
          <input type="email" id="novo-email" placeholder="Email">
        </div>
        <button type="submit" class="botao-primario">Salvar</button>
        <p id="novo-erro" class="mensagem-erro escondido"></p>
      </form>
    </div>
  </div>

  <!-- Modal: clicou num evento existente -->
  <div id="modal-evento" class="modal-fundo escondido">
    <div class="modal-caixa">
      <button class="botao-fechar" data-fechar="modal-evento" aria-label="Fechar">×</button>
      <h2 id="evento-titulo">Horário</h2>
      <p id="evento-info" class="modal-info"></p>
      <p id="evento-cliente" class="modal-info"></p>
      <div class="painel-acoes">
        <button class="botao-secundario" id="btn-remover-evento">Remover</button>
      </div>
      <p id="evento-erro" class="mensagem-erro escondido"></p>
    </div>
  </div>

  <!-- Modal: configuração do expediente -->
  <div id="modal-config" class="modal-fundo escondido">
    <div class="modal-caixa">
      <button class="botao-fechar" data-fechar="modal-config" aria-label="Fechar">×</button>
      <h2>Expediente</h2>
      <form id="form-config" class="form-grade" style="padding:0; margin:0;">
        <div class="campo">
          <label for="config-hora-abertura">Abre às</label>
          <input type="time" id="config-hora-abertura" required>
        </div>
        <div class="campo">
          <label for="config-hora-fechamento">Fecha às</label>
          <input type="time" id="config-hora-fechamento" required>
        </div>
        <div class="campo">
          <label for="config-duracao">Duração do bloqueio manual (min)</label>
          <input type="number" id="config-duracao" min="5" step="5" required>
        </div>
        <div class="campo campo-largo">
          <label>Dias de atendimento</label>
          <div class="checkboxes-dias" id="config-dias">
            <label><input type="checkbox" value="1"> Seg</label>
            <label><input type="checkbox" value="2"> Ter</label>
            <label><input type="checkbox" value="3"> Qua</label>
            <label><input type="checkbox" value="4"> Qui</label>
            <label><input type="checkbox" value="5"> Sex</label>
            <label><input type="checkbox" value="6"> Sáb</label>
            <label><input type="checkbox" value="0"> Dom</label>
          </div>
        </div>
        <div class="campo campo-largo">
          <button type="submit" class="botao-primario" style="margin-top:0;">Salvar expediente</button>
          <p id="config-mensagem" class="mensagem-erro escondido"></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: faturamento da semana -->
  <div id="modal-faturamento" class="modal-fundo escondido">
    <div class="modal-caixa">
      <button class="botao-fechar" data-fechar="modal-faturamento" aria-label="Fechar">×</button>
      <h2>Faturamento da semana</h2>
      <p id="faturamento-periodo" class="modal-info"></p>
      <div id="faturamento-lista" class="lista-faturamento"></div>
      <div class="faturamento-total">
        <span>Total da semana</span>
        <strong id="faturamento-total-valor">€0</strong>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
